<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toggtime</title>
  <meta name="description" content="Toggtime, a 1995 Turbo Pascal demo that fills the text screen with random characters and colors, running in your browser.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.css">
  <script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/js-dos.js"></script>
  <style>
    html, body, #dos {
      height: 100%;
      margin: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="dos"></div>
  <script>
    const dos = document.getElementById("dos");

    Dos(dos, {
      url: "toggtime.jsdos",
      pathPrefix: "https://cdn.jsdelivr.net/npm/js-dos@8.5.3/dist/emulators/",
      kiosk: true,
      autoStart: true,
      renderAspect: "4/3",
    });

    // Captured, so the emulator's own handlers cannot swallow the event
    dos.addEventListener("dblclick", () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        dos.requestFullscreen();
      }
    }, true);
  </script>
</body>
</html>
